let state={screen:"home",mode:null,name:"",clazz:"",pool:[],index:0,score:0,correct:0,wrongCount:0,streak:0,timer:null,pending:null,locked:false,restart:false,finishSent:false,seenChallenge:new Set()};
const CHEAT_NOTICE_KEY="lovciKomplexnihoPravopisu_cheatNotice";
function clearCheatNotice(){try{sessionStorage.removeItem(CHEAT_NOTICE_KEY)}catch(e){}}
function activeProtected(){return ["challenge","test"].includes(state.mode)&&state.screen==="question"&&!state.finishSent}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function clearTimer(){clearInterval(state.timer);state.timer=null}function clearPending(){clearTimeout(state.pending);state.pending=null}
function render(html,mode=state.mode){document.body.className=mode?"mode-"+mode:"";app.innerHTML=html;document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){if(activeProtected()){cheatFinish("opuštění aplikace");return}if(state.cheated)clearCheatNotice();clearTimer();clearPending();state.screen="home";state.mode=null;render('<div class="card"><h1 class="title">Lovci komplexního pravopisu</h1><p class="subtitle">Pravopisné úlohy ze všech pěti loveckých aplikací.<br><strong>'+DATA.length+' úloh • 15 s výběr • 40 s psaní</strong></p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">TEST: 30 náhodných úloh, každá za 1 bod.<br>VÝZVA: 30 správných odpovědí v řadě = jednička. Chyba nebo vypršení času začíná novou sérii.<br>V testu je po šesti úlohách z každé aplikace. U místních přídavných jmen napiš oba tvary; oba správně = 1 bod. Rozlišuje se diakritika i velikost písmen.</p><table class="resultTable"><tr><th>Body v testu</th><th>Známka</th></tr><tr><td>30–27</td><td>1</td></tr><tr><td>26–24</td><td>2</td></tr><tr><td>23–21</td><td>3</td></tr><tr><td>20–18</td><td>4</td></tr><tr><td>17–0</td><td>5</td></tr></table></div>',null)}
function nameScreen(mode){clearPending();state.mode=mode;state.screen="name";render('<div class="card"><h1 class="title">'+(mode==="challenge"?"VÝZVA":"TEST")+'</h1><div class="nameBox"><input class="input" id="name" autocomplete="name" placeholder="Jméno žáka" aria-label="Jméno žáka"><input class="input" id="clazz" placeholder="Třída" aria-label="Třída"><button class="btn '+(mode==="challenge"?"challengeBtn":"testBtn")+'" id="start">ZAČÍT</button>'+(mode==="challenge"?'<button class="btn ghost" data-act="home">HLAVNÍ MENU</button>':'')+'</div></div>');document.getElementById("start").onclick=()=>{const n=document.getElementById("name").value.trim(),c=document.getElementById("clazz").value.trim();if(!n||!c){alert("Vyplň jméno i třídu.");return}state.name=n;state.clazz=c;start(mode)}}
function start(mode){clearCheatNotice();clearTimer();clearPending();state={...state,screen:"question",mode,pool:mode==="test"?testPool():shuffle(DATA),index:0,score:0,correct:0,wrongCount:0,streak:0,locked:false,restart:false,finishSent:false,cheated:false,cheatSoundPending:false,seenChallenge:new Set()};next()}

function testPool(){return shuffle([22,23,24,25,26].flatMap(source=>shuffle(DATA.filter(q=>q.source===source)).slice(0,6)))}
function renderQuestion(){const q=state.current,w=q.type==="written";state.choices=w?[]:shuffle(q.options.map(text=>({text,correct:q.answers.includes(text)})));const line=w?esc(q.place):q.before!==undefined?esc(q.before)+' <span class="blank">_____</span> '+esc(q.after):esc(q.sentence);render(`<div class="card"><div class="topbar"><div class="seal ${state.mode==='challenge'?'challengeSeal':'testSeal'}">${state.mode==='challenge'?'VÝZVA':'TEST'}</div><div class="timeCenter"><span id="time">${w?40:15}</span><span class="status">${state.mode==='test'?'ÚLOHA '+(state.index+1)+'/30 • BODY '+state.score:'SÉRIE '+state.streak+'/30'}</span></div><div class="seal sectionSeal">${esc(q.category)}</div></div><div class="prompt">${w?'Napiš přídavné jméno: jednotné a množné číslo (1. pád, mužský rod životný).':'Vyber správné doplnění.'}</div><div class="question">${line}</div>${w?'<form id="writtenForm" autocomplete="off"><div class="nameBox"><label for="singular">Jednotné číslo (muž)</label><input class="input" id="singular" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><label for="plural">Množné číslo (muži)</label><input class="input" id="plural" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"><button class="btn" type="submit">POTVRDIT</button></div></form>':'<div class="choiceGrid">'+state.choices.map((x,i)=>'<button class="choiceBtn" data-choice="'+i+'">'+esc(x.text)+'</button>').join('')+'</div>'}<div class="feedback" id="fb" aria-live="polite"></div><div class="row" id="nextRow"></div></div>`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice),b));if(w){document.getElementById('writtenForm').onsubmit=e=>{e.preventDefault();if(state.locked)return;const norm=s=>s.trim().normalize('NFC');finishAnswer(norm(document.getElementById('singular').value)===q.singular&&norm(document.getElementById('plural').value)===q.plural,null,false)};document.getElementById('singular').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('plural').focus()}};document.getElementById('singular').focus()}}


function correctSentence(q){if(q.type==='written')return esc(q.singular)+' • '+esc(q.plural);if(q.before!==undefined)return esc(q.before)+' <span class="correctText">'+esc(q.answers[0])+'</span> '+esc(q.after);return q.answers.map(a=>esc(q.sentence.replace('_',a))).join(' / ')}

function markChoices(selected){document.querySelectorAll("[data-choice]").forEach((b,i)=>{b.disabled=true;if(state.choices[i].correct)b.classList.add("correct");else if(b===selected)b.classList.add("wrong")})}
function answer(i,button){if(state.locked||state.screen!=="question")return;finishAnswer(state.choices[i].correct,button,false)}
function timeout(){if(!state.locked&&state.screen==="question")finishAnswer(false,null,true)}
function finishAnswer(good,button,expired){state.locked=true;clearTimer();markChoices(button);document.querySelectorAll("#writtenForm input,#writtenForm button").forEach(e=>e.disabled=true);const q=state.current,fb=document.getElementById("fb");if(good){state.correct++;state.score++;state.streak++;fb.innerHTML='<span class="ok">SPRÁVNĚ!'+(state.mode==="test"?" +1 BOD":"")+'</span>';soundCorrect()}else{state.wrongCount++;state.streak=0;state.restart=state.mode==="challenge";fb.innerHTML='<span class="bad">'+(expired?"ČAS VYPRŠEL":"CHYBA")+(state.restart?" — VÝZVA ZAČÍNÁ ZNOVU":"")+'</span><br><span class="small">Správně: '+correctSentence(q)+'</span>';soundWrong()}state.index++;if(state.mode==="challenge"&&good&&state.streak>=CHALLENGE_TARGET){state.pending=setTimeout(finishChallenge,800);return}document.getElementById("nextRow").innerHTML='<button class="btn ghost" data-act="next">'+(state.restart?"MENU":state.mode==="test"&&state.index===TEST_COUNT?"VÝSLEDEK":"DALŠÍ")+'</button>';document.querySelector('[data-act="next"]').onclick=state.restart?()=>{clearTimer();clearPending();state.screen="finish";home()}:advance;if(!state.restart)state.pending=setTimeout(advance,good?850:10000)}
function advance(){if(!state.locked||state.screen!=="question")return;clearPending();state.restart=false;next()}

function startTimer(){state.deadline=Date.now()+(state.current.type==="written"?40:TIME_LIMIT)*1000;updateTime();state.timer=setInterval(()=>{updateTime();if(Date.now()>=state.deadline){clearTimer();timeout()}},100)}
function updateTime(){const e=document.getElementById("time");if(e)e.textContent=Math.max(0,Math.ceil((state.deadline-Date.now())/1000))}
function grade(s){return s>=27?1:s>=24?2:s>=21?3:s>=18?4:5}
function finishChallenge(){clearTimer();clearPending();state.screen="finish";render('<div class="card"><h1 class="title">VÝZVA SPLNĚNA</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>30 správných odpovědí za sebou — známka 1</b></div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(1,"VÝZVA")}
function finish(){clearTimer();clearPending();state.screen="finish";const z=grade(state.score);render('<div class="card"><h1 class="title">VÝSLEDEK TESTU</h1><div class="result"><b>'+esc(state.name)+'</b> • '+esc(state.clazz)+'<br><b>Body:</b> '+state.score+'/'+TEST_COUNT+'<br><b>Známka:</b> '+z+'</div><div class="sendStatus" id="sendStatus"></div><div class="row"><a class="btn ghost" href="'+RESULTS_SHEET_URL+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>');sendResult(z,"TEST")}

function cheatFinish(reason){if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen="finish";state.cheatSoundPending=document.visibilityState==="hidden";clearTimer();clearPending();try{sessionStorage.setItem(CHEAT_NOTICE_KEY,JSON.stringify({mode:state.mode,name:state.name,clazz:state.clazz,score:state.score,reason,timestamp:new Date().toISOString()}))}catch(e){}if(!state.cheatSoundPending)soundCheat();sendResult(6,"PODVOD: "+reason,true);renderCheatResult()}
function restoreCheatNotice(){let notice;try{notice=JSON.parse(sessionStorage.getItem(CHEAT_NOTICE_KEY)||"null")}catch(e){}if(!notice)return false;clearCheatNotice();state={...state,screen:"finish",mode:notice.mode==="challenge"?"challenge":"test",name:notice.name||"",clazz:notice.clazz||"",score:Number(notice.score)||0,cheated:true,finishSent:true,cheatSoundPending:false};renderCheatResult();return true}
function sendResult(z,kind,urgent=false){if(state.finishSent&&!urgent)return;state.finishSent=true;const payload=buildPayload(z,kind);try{localStorage.setItem("lovciKomplexnihoPravopisu_lastResult",JSON.stringify(payload))}catch(e){}const params=new URLSearchParams();Object.entries(payload).forEach(([k,v])=>params.append(k,String(v??"")));const body=params.toString();const pending=()=>{try{localStorage.setItem("lovciKomplexnihoPravopisu_pendingResult",JSON.stringify(payload))}catch(e){}const e=document.getElementById("sendStatus");if(e)e.textContent="Výsledek se nepodařilo odeslat. Poznamenej si body a známku."};try{let beaconQueued=false;if(urgent&&navigator.sendBeacon)beaconQueued=navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([body],{type:"application/x-www-form-urlencoded;charset=UTF-8"}));if(!beaconQueued)fetch(GAS_WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body,keepalive:true}).then(()=>{const e=document.getElementById("sendStatus");if(e)e.textContent="Požadavek na zápis byl odeslán. Výsledek ověř ve výsledkové tabulce."}).catch(pending)}catch(e){pending()}}
let audioContext=null,cheatSoundQueued=false;
function getAudioContext(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioContext||audioContext.state==="closed")audioContext=new A();return audioContext}catch(e){return null}}
function scheduleTone(c,freq,dur,gain,delay=0,type="sine"){const start=c.currentTime+Math.max(0,Number(delay)||0),peak=Math.max(.0001,Number(gain)||.08),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(peak,start+.02);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+dur+.02)}
function tone(freq,dur,gain=.08,delay=0,type="sine"){const c=getAudioContext();if(!c)return;const play=()=>{try{scheduleTone(c,freq,dur,gain,delay,type)}catch(e){}};if(c.state==="running")play();else c.resume().then(()=>{if(c.state==="running")play()}).catch(()=>{})}
function soundCorrect(){tone(760,.09,.08);tone(980,.11,.06,.08)}
function soundWrong(){tone(150,.18,.15)}
function playCheatSound(){tone(1450,1.0,.20,0,"sawtooth");tone(1180,1.0,.17,.48,"sawtooth");tone(1450,1.0,.20,1.0,"sawtooth")}
function soundCheat(){const c=getAudioContext();if(!c)return;if(c.state==="running"){playCheatSound();return}cheatSoundQueued=true;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
function unlockAudio(){const c=getAudioContext();if(!c||c.state==="running")return;c.resume().then(()=>{if(cheatSoundQueued&&c.state==="running"){cheatSoundQueued=false;playCheatSound()}}).catch(()=>{})}
document.addEventListener("pointerdown",unlockAudio,{passive:true});document.addEventListener("keydown",unlockAudio);
document.addEventListener("visibilitychange",()=>{if(document.hidden)cheatFinish("přepnutí mimo stránku");else if(state.cheatSoundPending){state.cheatSoundPending=false;soundCheat()}});
window.addEventListener("pagehide",()=>cheatFinish("opuštění stránky"));
window.addEventListener("blur",()=>{setTimeout(()=>{if(activeProtected()&&document.visibilityState==="visible"&&!document.hasFocus())cheatFinish("ztráta aktivního okna")},650)});
const actions={home:home,nameChallenge:()=>nameScreen("challenge"),nameTest:()=>nameScreen("test"),next:advance};if(!restoreCheatNotice())home();
</script>
